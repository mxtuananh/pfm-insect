  /v1/budgets/changes:
    get:
      summary: Budget changes
      description: 'Budgets created, changed or deleted (`deleted: true`) after `cursor`.
        Repeats are possible and harmless: merge by `id`. Keep calling with `nextCursor`
        while `hasMore` is true, and store the last `nextCursor` for next time.'
      parameters:
      - name: cursor
        in: query
        description: 'Where to continue: the `syncCursor` of a list response or the
          `nextCursor` of the previous page.'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return, 1 to 200 (default 50).
        schema:
          type: integer
      responses:
        "200":
          description: Changes after the cursor, oldest change first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetChangesResponse"
        "400":
          description: '`cursor` is missing or malformed, or `limit` is invalid.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: 'The cursor is older than the server keeps deletion markers.
            `code` is `full_resync_required`: reload the data and continue from a
            fresh `syncCursor`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/budgets/progress:
    get:
      summary: Budget progress
      description: 'For every budget that applies to the period containing `date`
        (the user''s local date, yyyy-MM-dd): spent, remaining, percent used, status
        and the alert thresholds reached, plus what the habits plan to spend over
        the period. Only expenses already synced to the server are counted. `status`
        is `exceeded` only when more than the amount was spent; spending exactly the
        amount reaches the 100% threshold but is still `warning`.'
      parameters:
      - name: date
        in: query
        description: The user's local date; the budgets are evaluated for the period
          containing it. Format `yyyy-MM-dd`.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: One entry per budget that applies to the period (empty if none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetProgressListResponse"
        "400":
          description: '`date` is missing or not a valid `yyyy-MM-dd` date.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/budgets/{id}:
    put:
      summary: Create or update a budget
      description: Creates the budget with the client-chosen id, or replaces its fields
        (last write wins). A recurring budget (default) repeats every day/month/year
        from the period containing `startDate`, until `endDate` if given; a non-recurring
        one covers only that period. Repeating the same request is safe.
      parameters:
      - name: id
        in: path
        description: 'Budget id: a UUID chosen by the client.'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBudgetRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
