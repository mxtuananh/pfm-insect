      summary: Create or update a habit
      description: 'Creates the habit with the client-chosen id, or replaces its fields
        (last write wins). A habit is only a template: the app copies it into expenses.
        Repeating the same request is safe.'
      parameters:
      - name: id
        in: path
        description: 'Habit id: a UUID chosen by the client.'
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertHabitRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
