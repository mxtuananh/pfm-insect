                $ref: "#/components/schemas/HabitResponse"
        "200":
          description: 'Replaced (or already identical: nothing changed).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitResponse"
        "400":
          description: A field is invalid or missing, `id` is not a UUID, `categoryId`
