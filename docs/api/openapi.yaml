        "200":
          description: 'Replaced (or already identical: nothing changed).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "400":
          description: A field is invalid or missing, `id` is not a UUID, `categoryId`
            is unknown, or the user already has the maximum of 100 budgets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
    delete:
      summary: Delete a budget
      description: Deletes the budget; devices learn about it through `/budgets/changes`.
        Always succeeds, even if the budget does not exist or is already deleted.
      parameters:
      - name: id
        in: path
        description: Budget id.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted (or there was nothing to delete).
        "400":
          description: '`id` is not a UUID.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/notifications:
    get:
      summary: Notifications
      description: Budget alerts, newest first; `unread=true` for the unread ones
        only. `unreadCount` counts all unread alerts, not just the ones on this page.
        `syncCursor` is where to start reading `/notifications/changes` from.
      parameters:
      - name: unread
        in: query
        description: '`true` to list only unread notifications (default `false`).'
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum number of items to return, 1 to 200 (default 50).
        schema:
          type: integer
      - name: before
        in: query
        description: 'Cursor of the next (older) page: the `nextCursor` of the previous
          response.'
        schema:
          type: string
      responses:
        "200":
          description: A page of notifications, newest first. `nextCursor` is null
            on the last page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPageResponse"
        "400":
          description: '`unread`, `limit` or `before` is invalid.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/notifications/changes:
    get:
      summary: Notification changes
      description: 'Notifications created or read after `cursor`; use it to catch
        up after being offline or disconnected from the stream, and to learn about
        alerts read on another device. Repeats are possible and harmless: merge by
        `id`. Keep calling with `nextCursor` while `hasMore` is true, and store the
        last `nextCursor` for next time.'
      parameters:
      - name: cursor
        in: query
        description: 'Where to continue: the `syncCursor` of a list response or the
          `nextCursor` of the previous page.'
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items to return, 1 to 200 (default 50).
        schema:
          type: integer
      responses:
        "200":
          description: Changes after the cursor, oldest change first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChangesResponse"
        "400":
          description: '`cursor` is missing or malformed, or `limit` is invalid.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: 'The cursor is older than the server keeps deletion markers.
            `code` is `full_resync_required`: reload the data and continue from a
            fresh `syncCursor`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/notifications/stream:
    get:
      summary: Live notifications (Server-Sent Events)
      description: 'Streams new alerts for the user while the connection is open.
        Send the usual `Authorization: Bearer` header and `Accept: text/event-stream`.
        The server first sends an event named `ready` (data `ok`) once it is subscribed:
        alerts created after it are not missed. Then it sends an event named `notification`
        whose `data` is one JSON `NotificationResponse` and whose `id` is the notification
        id. A comment line is sent every 20 seconds to keep the connection alive.
        Events are not replayed: after reconnecting, call `GET /notifications/changes`
        to catch up. The access token is checked only when the stream opens.'
      responses:
        "200":
          description: An endless `text/event-stream`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/notifications/read-all:
    post:
      summary: Mark all notifications read
      description: Marks every unread notification read and returns how many there
        were.
      responses:
        "200":
          description: How many notifications were marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadAllResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/notifications/{id}/read:
    put:
      summary: Mark a notification read
      description: Marks the notification read. Repeating it is safe.
      parameters:
      - name: id
        in: path
        description: Notification id (chosen by the server).
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The notification, now read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "400":
          description: '`id` is not a UUID.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The user has no notification with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
