      description: Deletes the habit; devices learn about it through `/habits/changes`.
        Always succeeds, even if the habit does not exist or is already deleted.
      parameters:
      - name: id
        in: path
        description: Habit id.
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted (or there was nothing to delete).
        "400":
          description: '`id` is not a UUID.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - auth-jwt: []
  /v1/budgets:
    get:
      summary: List budgets
      description: All not-deleted budgets, plus `syncCursor` to start reading `/budgets/changes`
        from.
      responses:
        "200":
          description: The user's budgets and the cursor to continue from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetListResponse"
        "401":
          description: Missing, invalid or expired access token. Refresh it with `POST
            /v1/auth/refresh` and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
